services:
  app:
    build: .
    image: swisstennis-ranking
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      # daily update (HH:MM, Europe/Zurich); empty disables it
      SCRAPE_TIME: ${SCRAPE_TIME-03:00}
    env_file: .env # MYTENNIS_USER / MYTENNIS_PASSWORD for the scraper
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Cloudflare Tunnel, enabled with COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in .env. In the
  # tunnel's public hostname settings, point the service to http://app:<PORT> (default 8000).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
